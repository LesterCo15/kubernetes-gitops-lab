
name: HealthyBudget CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
    - "app/**"
    - ".github/workflows/ci.yaml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set Image tag
        id: image
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ci-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: docker build -t ghcr.io/lesterco15/healthybudget:${{ steps.image.outputs.tag }} ./app

      - name: Push docker image
        run: docker push ghcr.io/lesterco15/healthybudget:${{ steps.image.outputs.tag }}
