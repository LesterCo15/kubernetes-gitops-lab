name: HealthyBudget PR Validation

on:
  workflow_dispatch:

  pull_request:
    type:
    - opened
    - sychronized
    - reopened
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Docker image for validation
        run: docker build -t healthybudget:pr-validation ./app
