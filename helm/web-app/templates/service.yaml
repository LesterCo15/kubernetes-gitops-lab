
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web-app
  labels:
    app.kubernetes.io/name: web-app
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: web-app
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
