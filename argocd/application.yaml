
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-app-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/LesterCo15/kubernetes-gitops-lab.git
    targetRevision: main
    path: helm/web-app
    helm:
      releaseName: gitops-lab
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
